    .dropdown-content {

<body>

  <header>
    <div class="header-main">
      <a href="index.html" aria-label="VS Studio Home">

    <div class="lang-dropdown" id="langMenu">
      <div class="lang-button" aria-label="Language selector">
        <span class="globe-icon">🌐</span>
        <span>Japanese</span>
      </div>
      <div class="dropdown-content">
        <a href="recruit.html">Japanese</a>
        <a href="en-recruit.html">English</a>
      </div>
    </div>

  <main>
    <section class="recruit-section">
      <h1 class="page-title">RECRUIT</h1>

      <div class="recruit-lead">
        VS Studioでは、正式な採用活動の本格開始に先立ち、今期予定していた主要な採用枠は充足いたしました。<br>
        次回の新規募集は、2027年以降になる見通しです。<br><br>
        つきましては、現在掲載している追加募集職種は、今後の開発体制強化において、専門領域に限定したものとなります。
      </div>

      <div class="job-list" aria-label="募集中の職種">
        <a class="job-link" href="recruit-motion-designer.html">
          <span class="job-link-title">モーションデザイナー（3Dアニメーションデザイナー）</span>
          <span class="job-link-arrow" aria-hidden="true">→</span>
        </a>

        <a class="job-link" href="recruit-gameplay-system-engineer.html">
          <span class="job-link-title">アクションゲームプレイ・システムエンジニア</span>
          <span class="job-link-arrow" aria-hidden="true">→</span>
        </a>
      </div>


      <div class="back-link-wrap">
        <a href="index.html" class="back-link">Back to Home</a>
      </div>
    </section>
  </main>

  <footer>© 2026 VS STUDIO</footer>

  <script>
    const langMenu = document.getElementById('langMenu');

    langMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      langMenu.classList.remove('active');
    });


    var submitted = false;
    var turnstileVerified = false;

    function turnstileSuccess() {
      turnstileVerified = true;

      var submitButton = document.getElementById('submit-button');
      var errorMessage = document.getElementById('turnstile-error');

      if (submitButton) {
        submitButton.disabled = false;
      }

      if (errorMessage) {
        errorMessage.style.display = 'none';
      }
    }

    function turnstileExpired() {
      turnstileVerified = false;

      var submitButton = document.getElementById('submit-button');

      if (submitButton) {
        submitButton.disabled = true;
      }
    }

    function handleContactSubmit() {
      if (!turnstileVerified) {
        var errorMessage = document.getElementById('turnstile-error');

        if (errorMessage) {
          errorMessage.style.display = 'block';
        }

        return false;
      }

      submitted = true;
      return true;
    }
  </script>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){document.getElementById('form_area').style.display='none'; document.getElementById('thanks_message').style.display='block';}"></iframe>

</body>
